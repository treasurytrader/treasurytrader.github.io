<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>C# 코드 포맷터 (4 Spaces / Allman)</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #1e1e1e; color: #d4d4d4; margin: 0; padding: 16px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; }
  button { background: #0e639c; color: white; border: none; padding: 8px 16px; font-size: 14px; border-radius: 4px; cursor: pointer; font-weight: 600; }
  button:hover { background: #1177bb; }
  button.copy { background: #2e7d32; }
  button.copy:hover { background: #388e3c; }
  button.clear { background: #424242; }
  button.clear:hover { background: #555; }
  .status { margin-left: auto; font-size: 13px; color: #4ec9b0; }
  .container { display: flex; gap: 12px; flex: 1; min-height: 0; }
  textarea { flex: 1; background: #252526; color: #d4d4d4; border: 1px solid #3c3c3c; border-radius: 4px; padding: 12px; font-family: 'Consolas', 'D2Coding', monospace; font-size: 13px; line-height: 1.5; resize: none; tab-size: 4; outline: none; }
  textarea:focus { border-color: #007acc; }
</style>
</head>
<body>
  <div class="toolbar">
    <button onclick="runFormat()">정렬 실행 (Format)</button>
    <button class="copy" onclick="copyResult()">결과 복사 (Copy)</button>
    <button class="clear" onclick="clearAll()">지우기</button>
    <span class="status" id="status">준비 완료 (공백 4칸 기준)</span>
  </div>
  <div class="container">
    <textarea id="input" placeholder="여기에 C# 코드를 붙여넣으세요..."></textarea>
    <textarea id="output" placeholder="정렬된 C# 코드가 여기에 표시됩니다..." readonly></textarea>
  </div>

<script>
/**
 * [AI 및 유지보수 참고용 설계 문서]
 * 목적: 외부 서버 전송 없이 브라우저 로컬에서 C# 코드(NinjaScript 등)의 들여쓰기를 표준(공백 4칸)으로 정렬합니다.
 * 핵심 원리: 정규식 치환 대신 문자 단위 상태 머신(State Machine)으로 순회하여 주석과 문자열 내부의 중괄호({, }) 오인식을 원천 차단합니다.
 *
 * [주의 사항 - 향후 수정 시 반드시 유지해야 할 규칙]
 * 1. inMultiLineComment 상태는 여러 줄 주석(/* ... *​/) 내부의 중괄호가 indentLevel에 영향을 주지 않도록 줄 단위로 반드시 먼저 검사해야 합니다.
 * 2. C# 문자열 보간($"...") 및 일반 문자열("...") 내부의 '{', '}'는 inString 플래그로 무시되어야 합니다.
 * 3. 여러 줄 문자열(@"...")은 내부 줄바꿈과 들여쓰기를 보존하기 위해 rawLine 그대로 출력합니다.
 * 4. 닫는 중괄호('}')로 시작하는 줄(예: }, } else, } catch)은 현재 줄 출력 전에 먼저 들여쓰기를 감소시켜야 합니다.
 */
function formatCSharp(code, indentSize = 4) {
  const indentUnit = ' '.repeat(indentSize);
  const lines = code.replace(/\r\n/g, '\n').split('\n');

  let indentLevel = 0;            // 현재 중괄호({ }) 깊이
  let inMultiLineComment = false; // 블록 주석(/* ... */) 활성 상태 여부
  let inVerbatimString = false;   // 여러 줄 문자열(@"...") 활성 상태 여부
  const result = [];

  for (let i = 0; i < lines.length; i++) {
    let rawLine = lines[i];

    // [1단계] 여러 줄 문자열(@"...") 내부는 원본 들여쓰기 및 공백을 그대로 유지
    if (inVerbatimString) {
      result.push(rawLine);
      let quoteCount = 0;
      for (let c = 0; c < rawLine.length; c++) {
        if (rawLine[c] === '"') {
          // "" 는 이스케이프된 따옴표이므로 2칸 건너뜀
          if (rawLine[c + 1] === '"') { c++; }
          else { quoteCount++; }
        }
      }
      // 홀수 개의 따옴표가 등장하면 여러 줄 문자열 종료
      if (quoteCount % 2 === 1) inVerbatimString = false;
      continue;
    }

    let trimmed = rawLine.trim();

    // 빈 줄은 공백 없이 그대로 추가
    if (trimmed === '') {
      result.push('');
      continue;
    }

    // [2단계] 전처리기 지시문(#region, #endregion, #if 등)은 항상 들여쓰기 0 고정
    if (trimmed.startsWith('#')) {
      result.push(trimmed);
      continue;
    }

    // [3단계] 이전 줄에서 시작된 블록 주석(/* ... */)이 이어지는 경우 처리
    // 주의: 주석 내부에 중괄호({, })가 포함되어 있더라도 indentLevel을 절대 변경하지 않음
    if (inMultiLineComment) {
      result.push(indentUnit.repeat(indentLevel) + trimmed);
      let commentIdx = 0;
      while (commentIdx < trimmed.length) {
        if (trimmed[commentIdx] === '*' && trimmed[commentIdx + 1] === '/') {
          inMultiLineComment = false;
          commentIdx += 2;
          break;
        }
        commentIdx++;
      }
      continue;
    }

    // [4단계] 현재 줄에서 실제 코드 영역의 여는/닫는 중괄호({, }) 개수 계산
    let openBraces = 0;
    let closeBraces = 0;
    let inString = false;      // 일반 문자열("...") 및 보간 문자열($"...") 상태
    let inChar = false;        // 문자 리터럴('...') 상태
    let inLineComment = false; // 한 줄 주석(//) 상태

    for (let c = 0; c < trimmed.length; c++) {
      const ch = trimmed[c];
      const next = trimmed[c + 1];

      // 한 줄 주석(//) 이후는 줄 끝까지 모두 무시
      if (inLineComment) break;

      // 한 줄 안에서 시작하고 끝나는 블록 주석(/* ... */) 처리
      if (inMultiLineComment) {
        if (ch === '*' && next === '/') {
          inMultiLineComment = false;
          c++;
        }
        continue;
      }

      // 문자열 내부 처리 (이스케이프 문자 \" 또는 \\ 건너뜀)
      if (inString) {
        if (ch === '\\') { c++; continue; }
        if (ch === '"') inString = false;
        continue;
      }

      // 문자 리터럴 내부 처리 (예: '{', '}', '\'')
      if (inChar) {
        if (ch === '\\') { c++; continue; }
        if (ch === "'") inChar = false;
        continue;
      }

      // 주석 및 문자열 시작 토큰 감지
      if (ch === '/' && next === '/') { inLineComment = true; break; }
      if (ch === '/' && next === '*') { inMultiLineComment = true; c++; continue; }
      if (ch === '@' && next === '"') { inVerbatimString = true; c++; continue; }
      if (ch === '"') { inString = true; continue; }
      if (ch === "'") { inChar = true; continue; }

      // 순수 코드 영역의 중괄호만 카운트
      if (ch === '{') openBraces++;
      else if (ch === '}') closeBraces++;
    }

    // [5단계] 현재 줄의 출력 들여쓰기 레벨 결정
    // 줄 맨 앞이 닫는 중괄호('}')로 시작하면 해당 개수만큼 즉시 들여쓰기 감소
    let leadingClose = 0;
    for (let c = 0; c < trimmed.length; c++) {
      if (trimmed[c] === '}') leadingClose++;
      else if (!/\s/.test(trimmed[c])) break;
    }

    let currentIndent = Math.max(0, indentLevel - leadingClose);

    // switch 문 내부의 case / default 라벨은 본문보다 한 단계(4칸) 왼쪽으로 배치
    if (/^(case\b.*:|default\s*:)/.test(trimmed) && currentIndent > 0) {
      result.push(indentUnit.repeat(currentIndent - 1) + trimmed);
    } else {
      result.push(indentUnit.repeat(currentIndent) + trimmed);
    }

    // [6단계] 다음 줄에 적용할 누적 중괄호 깊이 갱신
    indentLevel = Math.max(0, indentLevel + openBraces - closeBraces);
  }

  return result.join('\n');
}

// 정렬 실행 버튼 핸들러
function runFormat() {
  const input = document.getElementById('input').value;
  if (!input.trim()) return;
  const formatted = formatCSharp(input, 4);
  document.getElementById('output').value = formatted;
  setStatus('정렬 완료!');
}

// 결과 복사 버튼 핸들러
function copyResult() {
  const output = document.getElementById('output');
  if (!output.value) return;
  output.select();
  navigator.clipboard.writeText(output.value);
  setStatus('클립보드에 복사되었습니다!');
}

// 전체 초기화 버튼 핸들러
function clearAll() {
  document.getElementById('input').value = '';
  document.getElementById('output').value = '';
  setStatus('초기화 완료');
}

// 우측 상단 상태 메시지 표시 (2.5초 후 기본 문구로 복귀)
function setStatus(msg) {
  const el = document.getElementById('status');
  el.textContent = msg;
  setTimeout(() => { el.textContent = '준비 완료 (공백 4칸 기준)'; }, 2500);
}

// 왼쪽 입력창에 붙여넣기(Ctrl+V) 시 10ms 후 자동으로 정렬 실행
document.getElementById('input').addEventListener('paste', () => {
  setTimeout(runFormat, 10);
});
</script>
</body>
</html>
